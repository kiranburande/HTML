<!-- Demo on  -->
<!DOCTYPE html>
<html lang="en">
 <head>
    
   <link rel="icon" href="images/logo1.jpeg"/>
     <style>
	    body{
		background:skyblue;
		}
	    #main{
		   background:pink;
		   color:black;
		   width:350px;
           margin:auto;
           border-radius:15px;	
           padding:25px;		   
		}
		#main:hover{
		 box-shadow:0 0 30px black;		
		}
		span{
		color:red;
		
		}
	 </style>
   </head>
 <body>
      <h3>demo on Application Form</h3>
	  <div id="main">
	  <h2>Registraion Form</h2>
	    <form id="frm1" action="Registraion.html" autocomplete="off">
		  <div>
		  <label for="fna">Fullname</label> <span>*</span> <br>
		  <input type="text" id="fna" required autofocus>		  
		  </div><br>
		  
		  <div>
		     <label for="em">EmailId</label> <span>*</span><br>
			 <input type="email" id="em" required>
		  </div><br>
		  
		  <div>
		    <label for="ph">Phone Number</label> <span>*</span><br>
			<input type="Number" id="ph" name="ph" min="6000000000" max="9999999999" required>	  
		  </div><br>
		  
		  <div>
		    <label for="dob">Date of Birth</label><br>
			<input type="date" id="dob" name="dob" min="1996-01-01" max="2010-12-31">
		  </div><br>
		  
		  <div>
		     <label>Gender</label><br>
			 <input type="radio" id="g1" name="g" value="m" checked><label for="g1">Male</label>
			 <input type="radio" id="g2" name="g" value="f"><label for="g2">Female</label>
			 <input type="radio" id="g3" name="g" value="o"><label for="g3">Others</label>
		  </div><br>
		  
		  <div>
		     <label for="course">select course</label><br>
			 <select id="course" name="course">
			     <option value="">Select Course</option>
			     <option value="a">Full Stack Java</option>
				 <option value="b">Full Stack .net</option>
				 <option value="c">Full Stack Python</option>
				 <option value="d">Mern Stack</option>
				 <option value="e">C language</option>
				 <option value="f">HTML-JavaScript</option>
				 
			 </select>
		  </div><br>
		  
		  <div>
		     <label for="mot">Mode of Training</label><br>
			 <select id="mot" name="mot">
			 <option value="">Select Course</option>
			 <option value="ct">Classrrom Training</option>
			 <option value="ot">Online Training</option>
			 <option value="pmt">Placement Training</option>
			 <option value="pt">Project Training</option>
			 <option value="inter">Internship</option>
			 </select>
		  </div><br>
		  
		  <div>
		    <label for="addr">Full Address</label><br>
			<textarea id="addr" name="addr" rows="5" cols="25"></textarea>			
		  </div>
		  <br>
		  <div align="center">
		     <input type="checkbox" id="tc" name="tc" value="true" required><label>I Accepted all Terms and Conditions</label>
		  </div>
		  <br>
		  
		  <div align="center">
		  <button type="submit">Register Now</button>
		  </div>
		
		
		</form>	  
	  </div>  
 </body>

</html>
